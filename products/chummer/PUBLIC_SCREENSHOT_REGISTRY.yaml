product: chummer
version: 1
purpose: Screenshot-first proof policy for public guide pages.
pages:
  README.md:
    mandatory: false
    preferred_image_type: concept_art
    placement: below_scan_band
    purpose: Keep the front door scannable before any hero art appears.
  START_HERE.md:
    mandatory: false
    preferred_image_type: concept_art
    placement: top_banner
    purpose: Support orientation without outshouting the lane choices.
  WHAT_CHUMMER6_IS.md:
    mandatory: false
    preferred_image_type: screenshot
    placement: inline_proof
    purpose: Show one real receipt, compare state, or explanation panel when available.
  WHERE_TO_GO_DEEPER.md:
    mandatory: false
    preferred_image_type: none
    placement: none
    purpose: Keep the page list-first and route-focused.
  DOWNLOAD.md:
    mandatory: true
    preferred_image_type: screenshot
    placement: inline_proof
    purpose: Show a real preview app shell before the utility copy drops into package detail.
    assets:
      - path: assets/screenshots/download-preview-workspace.png
        alt: Real Chummer6 preview workspace screenshot
        caption: Real preview workspace from the current app, captured during an acceptance journey.
  HELP.md:
    mandatory: true
    preferred_image_type: screenshot
    placement: inline_proof
    purpose: Show a real preview app shell so the help page proves there is working software behind the support copy.
    assets:
      - path: assets/screenshots/help-preview-workspace.png
        alt: Real Chummer6 preview navigation screenshot
        caption: Real preview shell from a navigation sanity journey, used as proof that the current help flow is attached to a live app.
  FAQ.md:
    mandatory: false
    preferred_image_type: none
    placement: none
    purpose: Keep the FAQ fast unless one screenshot answers a repeated question better than text.
  FROM_CHUMMER5A_TO_CHUMMER6.md:
    mandatory: true
    preferred_image_type: screenshot
    placement: compare_blocks
    purpose: Migration proof should show familiar surfaces and changed flows, not themed art.
    assets:
      - path: assets/screenshots/migration-before.png
        alt: Chummer journey screenshot before save and reload
        caption: "Before: a real journey capture from the current workspace flow before the save and reload step."
      - path: assets/screenshots/migration-after.png
        alt: Chummer journey screenshot after save and reload
        caption: "After: the same journey after save and reload, used as concrete migration proof."
