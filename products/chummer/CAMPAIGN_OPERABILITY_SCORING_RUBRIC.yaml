product: chummer
version: 2
last_reviewed: 2026-07-20
purpose: Versioned whole-product scoring rubric for release readiness at campaign-operability level.

score_scale:
  0: unusable_or_deceptive
  1: bounded_but_not_ready
  2: trustworthy_preview
  3: flagship_ready

evidence_rules:
  aggregation: A cell score is the minimum score of every required journey and receipt; averaging and compensating scores are forbidden.
  score_0:
    - Required evidence is missing, unreadable, or absent from the fixed denominator.
  score_1:
    - Required evidence exists but does not pass either the preview or flagship contract.
    - A failed flagship receipt does not become preview evidence merely because it names blockers or next actions.
  score_2:
    - The exact source receipt contains a `campaign_operability_preview` object.
    - Its `contract_name` is `chummer.campaign_operability_preview_evidence` and `contract_version` is `1`.
    - Its status is `pass`, `bounded_owner` is resolved, and `next_actions` contains at least one concrete action.
    - Generated owner identifiers are canonical lowercase tokens; cell next actions preserve evidence traversal order and remove only later exact duplicates.
    - The Registry release channel may satisfy score `2` without the nested object only when it is published as `preview`, rollout is `promoted_preview`, supportability is `preview_supported`, release decision status is `review_required` or `preview_ready`, and support owner plus next actions are present.
    - A `review_required` Registry channel is transition evidence only. It cannot claim preview readiness or authorize publication; `PREVIEW_RELEASE_DECISION.generated.json` independently requires exact live convergence bound to that predecessor authority snapshot and decision.
  score_3:
    - Every required source receipt and journey passes its flagship contract without a preview exception.
  fail_closed:
    - Malformed preview declarations score `1`, not `2`.
    - A score-`2` row without both a bounded owner and concrete next action is downgraded to `1`.
    - Generated cells retain both preview blockers and flagship gaps so preview truth cannot erase stable debt.

decision_postures:
  preview:
    required_cell_count: 36
    minimum_cell_score: 2
    generated_status_field: preview_status
    generated_verdict: CAMPAIGN_OPERABILITY_PREVIEW_READY
  stable:
    required_cell_count: 36
    required_cell_score: 3
    generated_status_field: stable_status
    generated_verdict: CAMPAIGN_OPERABILITY_READY
  compatibility:
    - Top-level `status` and `verdict` remain aliases of the stable posture; they must never turn green for a score-`2` preview.

dimensions:
  - id: route_clarity
    label: Route clarity
    question: Can the user find the primary route and understand the bounded fallback?
  - id: rules_and_continuity_truth
    label: Rules and continuity truth
    question: Are numbers, campaign state, and restore behavior trustworthy and explainable?
  - id: recovery_confidence
    label: Recovery confidence
    question: Does the route expose an honest next safe action when things break?
  - id: closure_honesty
    label: Closure honesty
    question: Do support, public status, and product copy mean the same thing?
  - id: responsiveness
    label: Responsiveness
    question: Does the route stay inside the flagship responsiveness budgets or honestly degrade?
  - id: design_authorship
    label: Design authorship
    question: Does the route feel intentionally authored, accessible, and coherent across surfaces?

gating_rules:
  - Whole-product flagship readiness requires every dimension to score `3` on every promoted flagship surface.
  - A surface may be preview-promoted only when every dimension scores at least `2` and any `2` has a bounded owner and next action.
  - Any dimension scored `0` forces `flagship_ready` to stay non-ready.
  - Clean queues, green tests, or empty blocker lists do not replace this rubric.

required_surfaces:
  - desktop_workbench
  - public_front_door_and_support
  - install_claim_restore_continue
  - build_explain_publish
  - run_and_rejoin
  - improve_and_close_the_loop

closeout_rule:
  - Each flagship closeout slice must attach one owner and one score entry per dimension.
  - Promotion posture may not say `ready` unless this rubric is attached to the release decision.
