    allowed_public_audience:
      - players
      - gms
      - supporters
    shipped_claim_allowed: false
    expected_representation: public_horizon_page_with_receipts_and_future_facing_boundaries
    required_proof:
      - horizon_registry_public_guide_enabled
      - bounded_privacy_and_consent_posture
    canonical_sources:
      - products/chummer/HORIZON_REGISTRY.yaml
      - products/chummer/horizons/table-pulse.md
      - products/chummer/TABLE_PULSE_HEAT_REACTION_AUDIT_20260523.md
