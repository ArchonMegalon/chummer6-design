      - products/chummer/TABLE_PULSE_LIVING_WORLD_STACK_20260523.md
    forbidden_claims:
      - shipped live-session feature
      - autonomous table mutation
      - public guide claims of fully shipped table pulse
    notes: >
      Table Pulse may appear as a public-safe horizon page that explains heat, remote recipient
      packets, and bounded remote reaction mini-games, but it must stay explicitly future-facing,
      consent-bounded, and GM-governed rather than reading like a fully shipped live session
      feature.
