name: Weekly Product Pulse

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout design
        uses: actions/checkout@v4
        with:
          path: design
          fetch-depth: 0

      - name: Checkout fleet
        uses: actions/checkout@v4
        with:
          repository: ArchonMegalon/fleet
          path: fleet
          fetch-depth: 0

      - name: Checkout run services
        uses: actions/checkout@v4
        with:
          repository: ArchonMegalon/chummer6-hub
          path: chummercomplete/chummer.run-services

      - name: Checkout core engine
        uses: actions/checkout@v4
        with:
          repository: ArchonMegalon/chummer6-core
          path: chummercomplete/chummer-core-engine

      - name: Checkout play services
        uses: actions/checkout@v4
        with:
          repository: ArchonMegalon/chummer6-mobile
          path: chummercomplete/chummer-play

      - name: Checkout UI
        uses: actions/checkout@v4
        with:
          repository: ArchonMegalon/chummer6-ui
          path: chummercomplete/chummer6-ui

      - name: Checkout UI kit
        uses: actions/checkout@v4
        with:
          repository: ArchonMegalon/chummer6-ui-kit
          path: chummercomplete/chummer-ui-kit

      - name: Checkout media factory
        uses: actions/checkout@v4
        with:
          repository: ArchonMegalon/chummer6-media-factory
          path: fleet/repos/chummer-media-factory

      - name: Checkout public guide
        uses: actions/checkout@v4
        with:
          repository: ArchonMegalon/Chummer6
          path: chummercomplete/Chummer6

      - name: Checkout hub registry
        uses: actions/checkout@v4
        with:
          repository: ArchonMegalon/chummer6-hub-registry
          path: chummercomplete/chummer-hub-registry

      - name: Checkout executive assistant
        uses: actions/checkout@v4
        with:
          repository: ArchonMegalon/executive-assistant
          path: executive-assistant

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pyyaml

      - name: Prepare mirror directories
        run: mkdir -p fleet/.codex-design/product fleet/.codex-studio/published

      - name: Materialize weekly pulse
        env:
          CHUMMER_DOCKER_ROOT: ${{ github.workspace }}
        run: |
          bash design/scripts/ai/materialize_weekly_product_pulse.sh "$GITHUB_WORKSPACE/fleet" "$(date -u +%F)"

      - name: Verify design canon
        working-directory: design
        env:
          CHUMMER_DOCKER_ROOT: ${{ github.workspace }}
          CHUMMER6_GUIDE_ROOT: ${{ github.workspace }}/chummercomplete/Chummer6
          CHUMMER6_GUIDE_ASSET_SOURCE: ${{ github.workspace }}/chummercomplete/Chummer6/assets
          CHUMMER6_CORE_REPO_ROOT: ${{ github.workspace }}/chummercomplete/chummer-core-engine
          CHUMMER6_UI_REPO_ROOT: ${{ github.workspace }}/chummercomplete/chummer6-ui
          CHUMMER6_HUB_REPO_ROOT: ${{ github.workspace }}/chummercomplete/chummer.run-services
          CHUMMER6_MOBILE_REPO_ROOT: ${{ github.workspace }}/chummercomplete/chummer-play
          CHUMMER6_UI_KIT_REPO_ROOT: ${{ github.workspace }}/chummercomplete/chummer-ui-kit
          CHUMMER6_HUB_REGISTRY_REPO_ROOT: ${{ github.workspace }}/chummercomplete/chummer-hub-registry
          CHUMMER6_MEDIA_FACTORY_REPO_ROOT: ${{ github.workspace }}/fleet/repos/chummer-media-factory
          EXECUTIVE_ASSISTANT_REPO_ROOT: ${{ github.workspace }}/executive-assistant
          FLEET_REPO_ROOT: ${{ github.workspace }}/fleet
        run: bash scripts/ai/verify.sh

      - name: Commit refreshed pulse
        working-directory: design
        run: |
          if git diff --quiet -- products/chummer/PROGRESS_REPORT.generated.json products/chummer/PROGRESS_REPORT.generated.html products/chummer/PROGRESS_REPORT_POSTER.svg products/chummer/PROGRESS_HISTORY.generated.json products/chummer/WEEKLY_PRODUCT_PULSE.generated.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/chummer/PROGRESS_REPORT.generated.json products/chummer/PROGRESS_REPORT.generated.html products/chummer/PROGRESS_REPORT_POSTER.svg products/chummer/PROGRESS_HISTORY.generated.json products/chummer/WEEKLY_PRODUCT_PULSE.generated.json
          git commit -m "chore(design): refresh weekly product pulse"
          git push
