name: Design pull request CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  current-release-authority:
    name: Current release authority and generated-state guards
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact Chummer6 public-guide source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ArchonMegalon/Chummer6
          ref: f5a69e4cc241a464ad68338255bf449984b9af03
          path: .ci/chummer6
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.guide-internal/receipts/
            /assets/
            /FEATURES/
            /START_HERE.md
            /ONRAMP.md
            /BLACK_LEDGER_NEWSROOM.md
            /WHAT_CHUMMER6_IS.md
            /RUNNER_PASSPORT.md
            /LIVING_WORLD.md
            /SOURCE_BUILD_LINUX.md
            /SOURCE_BUILD_MACOS.md
            /HOW_CAN_I_HELP.md
            /WHERE_TO_GO_DEEPER.md
            /GLOSSARY.md

      - name: Create hash-locked Python environment
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/design-ci-python"
          "$RUNNER_TEMP/design-ci-python/bin/python" -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            --requirement .github/requirements-ci.txt

      - name: Compile release-authority materializers
        run: >-
          "$RUNNER_TEMP/design-ci-python/bin/python" -m compileall -q
          scripts/ai/materialize_campaign_operability_scorecard.py
          scripts/ai/materialize_release_scope_decision.py
          scripts/ai/materialize_preview_release_decision.py
          scripts/ai/materialize_final_gold_graph.py
          scripts/ai/materialize_current_release_state.py
          scripts/ai/materialize_public_guide_bundle.py

      - name: Verify hash-locked dependencies and action commit pins
        run: >-
          "$RUNNER_TEMP/design-ci-python/bin/python"
          scripts/ai/verify_ci_dependency_locks.py

      - name: Verify scorecard, preview, stable, and current-state semantics
        run: >-
          "$RUNNER_TEMP/design-ci-python/bin/python" -m pytest -q
          tests/test_materialize_campaign_operability_scorecard.py
          tests/test_materialize_release_scope_decision.py
          tests/test_materialize_preview_release_decision.py
          tests/test_materialize_final_gold_graph.py
          tests/test_materialize_current_release_state.py
          tests/test_validate_gold_claim_freshness.py
          tests/test_verify_ci_dependency_locks.py

      - name: Verify public-guide semantics and deterministic generated state
        env:
          CHUMMER6_GUIDE_ASSET_SOURCE: ${{ github.workspace }}/.ci/chummer6/assets
          CHUMMER6_PUBLIC_GUIDE_SOURCE_ROOT: ${{ github.workspace }}/.ci/chummer6
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/design-ci-python/bin/python" -m pytest -q \
            tests/test_materialize_public_guide_bundle.py
          "$RUNNER_TEMP/design-ci-python/bin/python" \
            scripts/ai/materialize_public_guide_bundle.py --check
